<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGrocer - Manajemen Bahan Makanan & Belanja</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for mobile frame */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Smartphone Frame Container -->
    <div class="w-full sm:max-w-[400px] h-screen sm:h-[844px] bg-slate-50 shadow-2xl sm:rounded-[40px] overflow-hidden flex flex-col relative border-0 sm:border-[10px] border-slate-800">
        
        <!-- Top Status Bar (Simulated) -->
        <div class="bg-emerald-600 text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold select-none z-20">
            <span>10:28</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- App Header Bar -->
        <header class="bg-emerald-600 text-white px-6 py-3 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center space-x-2">
                <div class="bg-white text-emerald-600 p-2 rounded-xl shadow">
                    <i class="fa-solid fa-basket-shopping text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">SmartGrocer</h1>
                    <p class="text-xs text-emerald-100">Dapur Pintar & Hemat</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="showToast('Tidak ada notifikasi baru')" class="relative text-white hover:text-emerald-200 transition">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span class="absolute top-0 right-0 w-2 h-2 bg-amber-400 rounded-full"></span>
                </button>
                <div class="w-9 h-9 rounded-full bg-emerald-500 border-2 border-emerald-300 overflow-hidden flex items-center justify-center font-bold text-white text-sm shadow">
                    <span>ZK</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24 pt-4 px-4 bg-slate-50">
            <!-- Dynamic content loaded via JS -->
        </main>

        <!-- Floating Action Button (FAB) for Kulkas tab -->
        <div id="fab-container" class="absolute bottom-20 right-6 z-30 hidden">
            <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition transform hover:scale-105 active:scale-95">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-3 px-6 flex justify-around items-center z-20 shadow-lg">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-emerald-600 transition">
                <i class="fa-solid fa-house text-xl mb-1"></i>
                <span class="text-[11px] font-medium">Home</span>
            </button>
            <button onclick="switchTab('kulkas')" id="nav-kulkas" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
                <i class="fa-solid fa-snowflake text-xl mb-1"></i>
                <span class="text-[11px] font-medium">Kulkas</span>
            </button>
            <button onclick="switchTab('belanja')" id="nav-belanja" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
                <i class="fa-solid fa-cart-shopping text-xl mb-1"></i>
                <span class="text-[11px] font-medium">Belanja</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-gray-400 hover:text-emerald-600 transition">
                <i class="fa-solid fa-gear text-xl mb-1"></i>
                <span class="text-[11px] font-medium">Settings</span>
            </button>
        </nav>

        <!-- Modal Tambah Barang / Scan Struk -->
        <div id="add-modal" class="absolute inset-0 bg-black/50 z-50 hidden flex items-end justify-center transition-opacity">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl animate-slide-up max-h-[80vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-slate-800">Tambah Bahan Makanan</h3>
                    <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600 p-1">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div class="border-2 border-dashed border-emerald-300 bg-emerald-50 rounded-2xl p-6 text-center cursor-pointer hover:bg-emerald-100 transition">
                        <i class="fa-solid fa-camera text-3xl text-emerald-600 mb-2"></i>
                        <p class="font-semibold text-emerald-800 text-sm">Simulasi Scan Struk Belanja</p>
                        <p class="text-xs text-emerald-600 mt-1">Otomatis deteksi item belanjaan Anda</p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Barang</label>
                        <input type="text" id="input-item-name" placeholder="Contoh: Daging Sapi 500gr" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori</label>
                        <select id="input-item-category" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm bg-white">
                            <option value="daging">Daging & Unggas</option>
                            <option value="sayur">Sayur & Buah</option>
                            <option value="susu">Produk Susu & Olahan</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Estimasi Kedaluwarsa</label>
                        <input type="text" id="input-item-expiry" placeholder="Contoh: 3 Hari Lagi" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    </div>

                    <button onclick="addItemToKulkas()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition">
                        Simpan ke Kulkas
                    </button>
                </div>
            </div>
        </div>

        <!-- Toast Notification Box -->
        <div id="toast" class="absolute top-16 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl z-50 hidden transition-all duration-300 flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-text">Berhasil!</span>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let currentTab = 'home';
        let kulkasTabState = 'daging';
        
        let kulkasData = {
            daging: [
                { name: 'Daging Sapi (800gr)', expiry: '3 Hari Lagi', status: 'warning', icon: 'fa-drumstick-bite' },
                { name: 'Ayam Fillet (1kg)', expiry: '5 Hari Lagi', status: 'safe', icon: 'fa-feather' }
            ],
            sayur: [
                { name: 'Bayam Segar', expiry: '1 Hari Lagi', status: 'danger', icon: 'fa-seedling' },
                { name: 'Wortel (500gr)', expiry: '7 Hari Lagi', status: 'safe', icon: 'fa-carrot' }
            ],
            susu: [
                { name: 'Susu UHT (1L)', expiry: '2 Hari Lagi', status: 'warning', icon: 'fa-bottle-droplet' },
                { name: 'Keju Cheddar', expiry: '14 Hari Lagi', status: 'safe', icon: 'fa-cheese' }
            ]
        };

        let belanjaData = [
            { name: 'Telur Ayam (1 Kotak)', checked: false },
            { name: 'Tomat (5 Buah)', checked: true },
            { name: 'Bawang Bombay (3 Buah)', checked: false },
            { name: 'Cabai Rawit (250gr)', checked: false }
        ];

        // Navigation Controller
        function switchTab(tab) {
            currentTab = tab;
            
            // Update active states on nav buttons
            ['home', 'kulkas', 'belanja', 'settings'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center text-emerald-600 transition";
                } else {
                    btn.className = "flex flex-col items-center text-gray-400 hover:text-emerald-600 transition";
                }
            });

            // Toggle FAB button visibility only on kulkas tab
            const fab = document.getElementById('fab-container');
            if (tab === 'kulkas') {
                fab.classList.remove('hidden');
            } else {
                fab.classList.add('hidden');
            }

            renderContent();
        }

        // Render Page Content Based on Current Tab
        function renderContent() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            if (currentTab === 'home') {
                container.innerHTML = `
                    <div class="space-y-4 animate-fade-in">
                        <!-- Welcome Banner -->
                        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow-md">
                            <h2 class="font-bold text-base">Halo, Zaki! 👋</h2>
                            <p class="text-xs text-emerald-100 mt-0.5">Ada 2 bahan makanan yang hampir kedaluwarsa hari ini.</p>
                        </div>

                        <!-- Peringatan Kedaluwarsa Section -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="font-bold text-sm text-slate-800 flex items-center">
                                    <i class="fa-solid fa-triangle-exclamation text-amber-500 mr-2"></i> Peringatan Kedaluwarsa!
                                </h3>
                                <span class="text-xs text-emerald-600 font-semibold cursor-pointer" onclick="switchTab('kulkas')">Lihat Semua</span>
                            </div>
                            <div class="space-y-2">
                                <div class="bg-white p-3 rounded-2xl shadow-sm border border-amber-100 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold">
                                            <i class="fa-solid fa-bottle-droplet"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-semibold text-sm text-slate-800">Susu UHT (1L)</h4>
                                            <p class="text-xs text-amber-600 font-medium">Sisa waktu: 2 Hari</p>
                                        </div>
                                    </div>
                                    <span class="text-xs bg-amber-100 text-amber-700 px-2.5 py-1 rounded-full font-semibold">Segera Masak</span>
                                </div>
                                <div class="bg-white p-3 rounded-2xl shadow-sm border border-red-100 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center font-bold">
                                            <i class="fa-solid fa-drumstick-bite"></i>
                                        </div>
                                        <div>
                                            <h4 class="font-semibold text-sm text-slate-800">Daging Sapi (800gr)</h4>
                                            <p class="text-xs text-red-600 font-medium">Sisa waktu: 3 Hari</p>
                                        </div>
                                    </div>
                                    <span class="text-xs bg-red-100 text-red-700 px-2.5 py-1 rounded-full font-semibold">Kritis</span>
                                </div>
                            </div>
                        </div>

                        <!-- Rekomendasi Resep Harian -->
                        <div>
                            <h3 class="font-bold text-sm text-slate-800 mb-2 flex items-center">
                                <i class="fa-solid fa-utensils text-emerald-600 mr-2"></i> Rekomendasi Resep Hari Ini
                            </h3>
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="h-32 bg-emerald-800 relative flex items-center justify-center text-white">
                                    <div class="absolute inset-0 bg-black/30"></div>
                                    <div class="relative z-10 text-center px-4">
                                        <span class="bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">Memanfaatkan Daging & Susu</span>
                                        <h4 class="font-bold text-lg mt-1">Sup Daging Krim Susu Spesial</h4>
                                    </div>
                                </div>
                                <div class="p-4">
                                    <div class="flex justify-between text-xs text-gray-500 mb-3">
                                        <span><i class="fa-regular fa-clock mr-1"></i> 30 Menit</span>
                                        <span><i class="fa-solid fa-fire mr-1"></i> Sedang</span>
                                        <span><i class="fa-solid fa-bowl-food mr-1"></i> 4 Porsi</span>
                                    </div>
                                    <button onclick="showToast('Resep berhasil disimpan ke favorit!')" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-semibold py-2 rounded-xl text-xs transition">
                                        Lihat Detail Resep & Bahan
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'kulkas') {
                let itemsHtml = kulkasData[kulkasTabState].map((item, idx) => `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold">
                                <i class="fa-solid ${item.icon}"></i>
                            </div>
                            <div>
                                <h4 class="font-semibold text-sm text-slate-800">${item.name}</h4>
                                <p class="text-xs text-gray-500 font-medium">Kedaluwarsa: <span class="${item.status === 'danger' ? 'text-red-600 font-bold' : 'text-emerald-600'}">${item.expiry}</span></p>
                            </div>
                        </div>
                        <button onclick="removeItem('${kulkasTabState}', ${idx})" class="text-gray-300 hover:text-red-500 p-2 transition">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="space-y-4 animate-fade-in">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-base text-slate-800">Isi Kulkasku</h2>
                            <span class="text-xs text-gray-500">Total: ${kulkasData.daging.length + kulkasData.sayur.length + kulkasData.susu.length} Item</span>
                        </div>

                        <!-- Kategori Tabs -->
                        <div class="flex space-x-2 border-b border-gray-200 pb-2">
                            <button onclick="setKulkasTab('daging')" class="px-4 py-1.5 rounded-full text-xs font-semibold transition ${kulkasTabState === 'daging' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-gray-600 border border-gray-200'}">
                                Daging (${kulkasData.daging.length})
                            </button>
                            <button onclick="setKulkasTab('sayur')" class="px-4 py-1.5 rounded-full text-xs font-semibold transition ${kulkasTabState === 'sayur' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-gray-600 border border-gray-200'}">
                                Sayur (${kulkasData.sayur.length})
                            </button>
                            <button onclick="setKulkasTab('susu')" class="px-4 py-1.5 rounded-full text-xs font-semibold transition ${kulkasTabState === 'susu' ? 'bg-emerald-600 text-white shadow' : 'bg-white text-gray-600 border border-gray-200'}">
                                Produk Susu (${kulkasData.susu.length})
                            </button>
                        </div>

                        <!-- Item List -->
                        <div class="space-y-2.5">
                            ${itemsHtml || '<p class="text-center text-xs text-gray-400 py-8">Belum ada item di kategori ini.</p>'}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'belanja') {
                let checklistHtml = belanjaData.map((item, idx) => `
                    <label class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleChecklist(${idx})" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500 border-gray-300">
                            <span class="font-medium text-sm ${item.checked ? 'line-through text-gray-400' : 'text-slate-800'}">${item.name}</span>
                        </div>
                        <span class="text-xs font-semibold text-emerald-600">Rp 5.000 - Rp 10.000</span>
                    </label>
                `).join('');

                container.innerHTML = `
                    <div class="space-y-4 animate-fade-in">
                        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl flex items-start space-x-3">
                            <i class="fa-solid fa-circle-info text-emerald-600 text-base mt-0.5"></i>
                            <p class="text-xs text-emerald-800 leading-relaxed">Bahan yang habis di kulkas otomatis masuk ke daftar belanja mingguan Anda.</p>
                        </div>

                        <h3 class="font-bold text-sm text-slate-800">Daftar Belanja Mingguan</h3>

                        <div class="space-y-2.5">
                            ${checklistHtml}
                        </div>

                        <!-- Checkout Card -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 space-y-3 mt-4">
                            <div class="flex justify-between text-xs text-gray-600">
                                <span>Estimasi Total Belanja</span>
                                <span class="font-bold text-slate-800 text-sm">Rp 25.000</span>
                            </div>
                            <button onclick="proceedToCheckout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-sm">
                                <i class="fa-solid fa-bag-shopping"></i>
                                <span>Pesan via Mitra (GrabMart)</span>
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'checkout') {
                container.innerHTML = `
                    <div class="space-y-4 animate-fade-in">
                        <button onclick="switchTab('belanja')" class="text-xs text-emerald-600 font-semibold flex items-center space-x-1 mb-2">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Kembali ke Belanja</span>
                        </button>

                        <h2 class="font-bold text-base text-slate-800">Konfirmasi Pesanan</h2>

                        <!-- Alamat Pengiriman -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Alamat Pengiriman</span>
                                <span class="text-xs text-emerald-600 font-semibold cursor-pointer" onclick="showToast('Fitur ganti alamat')">Ubah</span>
                            </div>
                            <div class="flex items-start space-x-3">
                                <i class="fa-solid fa-location-dot text-emerald-600 text-base mt-1"></i>
                                <div>
                                    <h4 class="font-semibold text-sm text-slate-800">Rumah Utama (Zaki)</h4>
                                    <p class="text-xs text-gray-500 leading-relaxed mt-0.5">Jl. Anggrek No. 5, RT 02/RW 04, Kel. Mangkubumen, Surakarta</p>
                                </div>
                            </div>
                        </div>

                        <!-- Ringkasan Pesanan -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Ringkasan Belanja</span>
                            <div class="space-y-2 text-xs text-gray-600 border-b border-gray-100 pb-3">
                                <div class="flex justify-between">
                                    <span>Total Bahan (4 Item)</span>
                                    <span>Rp 100.000</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Biaya Layanan & Ongkir GrabMart</span>
                                    <span>Rp 25.000</span>
                                </div>
                            </div>
                            <div class="flex justify-between text-sm font-bold text-slate-800">
                                <span>Total Pembayaran</span>
                                <span class="text-emerald-600">Rp 125.000</span>
                            </div>
                        </div>

                        <!-- Metode Pembayaran -->
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Metode Pembayaran</span>
                            <div class="flex items-center justify-between p-3 rounded-xl border-2 border-emerald-500 bg-emerald-50/50">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded-lg bg-purple-600 text-white font-bold flex items-center justify-center text-xs">OVO</div>
                                    <div>
                                        <h4 class="font-semibold text-xs text-slate-800">OVO Cash</h4>
                                        <p class="text-[10px] text-gray-500">Saldo: Rp 450.000</p>
                                    </div>
                                </div>
                                <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                            </div>
                        </div>

                        <!-- CTA Bayar & Kirim -->
                        <button onclick="completePayment()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm mt-2">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>Bayar & Kirim (Rp 125.000)</span>
                        </button>
                    </div>
                `;
            } else if (currentTab === 'settings') {
                container.innerHTML = `
                    <div class="space-y-4 animate-fade-in">
                        <h2 class="font-bold text-base text-slate-800">Pengaturan Akun</h2>
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-4">
                            <div class="flex items-center space-x-3 border-b border-gray-100 pb-4">
                                <div class="w-12 h-12 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-base">
                                    ZK
                                </div>
                                <div>
                                    <h4 class="font-bold text-sm text-slate-800">Zaki Ash Shiddiqi</h4>
                                    <p class="text-xs text-gray-500">zaki.smartgrocer@email.com</p>
                                </div>
                            </div>
                            <div class="space-y-2 text-xs font-medium text-gray-600">
                                <div class="flex justify-between items-center py-2 cursor-pointer hover:text-emerald-600" onclick="showToast('Notifikasi aktif')">
                                    <span>Notifikasi Kedaluwarsa</span>
                                    <i class="fa-solid fa-toggle-on text-emerald-600 text-lg"></i>
                                </div>
                                <div class="flex justify-between items-center py-2 cursor-pointer hover:text-emerald-600" onclick="showToast('Mode gelap belum tersedia')">
                                    <span>Mode Gelap (Dark Mode)</span>
                                    <i class="fa-solid fa-toggle-off text-gray-300 text-lg"></i>
                                </div>
                                <div class="flex justify-between items-center py-2 cursor-pointer hover:text-red-500" onclick="showToast('Berhasil keluar akun')">
                                    <span>Keluar (Logout)</span>
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Kulkas Tab Switcher
        function setKulkasTab(tab) {
            kulkasTabState = tab;
            renderContent();
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        // Add Item Logic
        function addItemToKulkas() {
            const name = document.getElementById('input-item-name').value;
            const category = document.getElementById('input-item-category').value;
            const expiry = document.getElementById('input-item-expiry').value;

            if (!name) {
                showToast('Mohon masukkan nama barang!');
                return;
            }

            kulkasData[category].push({
                name: name,
                expiry: expiry || '5 Hari Lagi',
                status: 'safe',
                icon: 'fa-basket-shopping'
            });

            closeAddModal();
            showToast('Barang berhasil ditambahkan ke kulkas!');
            
            // Reset form
            document.getElementById('input-item-name').value = '';
            document.getElementById('input-item-expiry').value = '';
            
            if (currentTab === 'kulkas') {
                renderContent();
            }
        }

        // Remove Item
        function removeItem(category, index) {
            kulkasData[category].splice(index, 1);
            showToast('Barang berhasil dihapus.');
            renderContent();
        }

        // Checklist toggle
        function toggleChecklist(index) {
            belanjaData[index].checked = !belanjaData[index].checked;
        }

        // Proceed to Checkout
        function proceedToCheckout() {
            currentTab = 'checkout';
            renderContent();
        }

        // Complete Payment / Order Success
        function completePayment() {
            showToast('Pembayaran Berhasil! Pesanan dikirim via GrabMart 🚀');
            setTimeout(() => {
                currentTab = 'home';
                renderContent();
            }, 1500);
        }

        // Toast Notification Function
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // Initialize App on Load
        window.onload = function() {
            renderContent();
        };
    </script>
</body>
</html>
